<div class="cs-card">
  <div class="cs-card-header">
    <span class="cs-tag">{{ caseStudy.tag }}</span>
    <h3 class="cs-card-title">{{ caseStudy.title }}</h3>
  </div>

  <div class="cs-card-content">
    <p class="cs-card-subtitle">{{ caseStudy.subtitle }}</p>
    <p class="cs-card-summary">{{ caseStudy.summary }}</p>

    <div class="cs-card-metrics">
      <div class="metric-card" *ngFor="let metric of caseStudy.metrics">
        <div class="metric-value">{{ metric.value }}</div>
        <div class="metric-label">{{ metric.label }}</div>
        <div *ngIf="metric.note" class="metric-note">{{ metric.note }}</div>
      </div>
    </div>
  </div>

  <div class="cs-card-footer">
    <div class="cs-tools">
      <span class="tool-badge" *ngFor="let tool of caseStudy.tools">{{ tool }}</span>
    </div>

    <div class="cs-actions">
      <a [routerLink]="['/case-studies', caseStudy.slug]" class="view-cs-btn">
        View Case Study <i class="fas fa-arrow-right" aria-hidden="true"></i>
      </a>
      <a *ngIf="caseStudy.link" [href]="caseStudy.link" target="_blank" rel="noopener noreferrer" class="dashboard-link" aria-label="View dashboard">
        <i class="fas fa-chart-line" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</div>
