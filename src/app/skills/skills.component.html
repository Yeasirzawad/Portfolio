<section class="skills-section">
  <!-- ===== Section Heading ===== -->
  <div class="section-heading">
    <h3>Skills</h3>
  </div>


  <!-- ===== Block 1: Technical Stack ===== -->
  <div class="skills-block">
    <div class="skills-block-header">
      <span class="block-label">Technical Stack</span>
      <span class="block-desc">Tools &amp; technologies I work with</span>
    </div>

    <div class="tools-grid">
      <div
        class="tool-chip"
        [class.dark-chip]="tool.darkChip"
        *ngFor="let tool of toolStack"
      >
        <img
          *ngIf="tool.iconUrl"
          [src]="tool.iconUrl"
          [alt]="tool.name + ' logo'"
          class="tool-logo"
          loading="lazy"
        />
        <div
          *ngIf="!tool.iconUrl"
          class="tool-monogram"
          [style.background]="tool.abbrBg"
          [style.color]="tool.abbrColor"
        >
          {{ tool.abbr }}
        </div>
        <span class="tool-name">{{ tool.name }}</span>
      </div>
    </div>
  </div>

  <!-- ===== Block 2: Methods & Expertise ===== -->
  <div class="skills-block">
    <div class="skills-block-header">
      <span class="block-label">Methods &amp; Expertise</span>
      <span class="block-desc">Analytical approaches and domain knowledge</span>
    </div>

    <div class="method-grid">
      <div
        class="method-card"
        *ngFor="let group of methodGroups"
        [style.border-top-color]="group.color"
      >
        <div class="method-card-header">
          <div
            class="method-icon-badge"
            [style.background]="group.colorLight"
            [style.color]="group.color"
          >
            <i [class]="group.icon" aria-hidden="true"></i>
          </div>
          <span class="method-card-title" [style.color]="group.color">{{ group.category }}</span>
        </div>
        <div class="method-tags">
          <span
            class="method-tag"
            *ngFor="let skill of group.skills"
            [style.--tag-hover-bg]="group.color"
          >{{ skill }}</span>
        </div>
      </div>
    </div>
  </div>

</section>
