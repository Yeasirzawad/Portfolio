<section class="case-study-section">
  <section class="section-heading">
    <h3>Case Studies</h3>
  </section>

  <p class="cs-intro">
    A deeper look at how I frame analytical problems, design solutions, and deliver
    measurable outcomes for clients and stakeholders.
  </p>

  <div class="cs-list">
    <div class="cs-card" *ngFor="let cs of caseStudies; let i = index"
         [class.open]="expandedIndex === i">
      <button class="cs-header" (click)="toggle(i)"
              [attr.aria-expanded]="expandedIndex === i">
        <div class="cs-header-left">
          <span class="cs-tag">{{ cs.tag }}</span>
          <h4 class="cs-title">{{ cs.title }}</h4>
          <p class="cs-summary">{{ cs.summary }}</p>
        </div>
        <span class="cs-chevron" aria-hidden="true">
          <i class="fas" [class.fa-chevron-down]="expandedIndex !== i" [class.fa-chevron-up]="expandedIndex === i"></i>
        </span>
      </button>

      <div class="cs-body" *ngIf="expandedIndex === i">
        <div class="cs-block">
          <h5 class="cs-block-label">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i> Challenge
          </h5>
          <p>{{ cs.challenge }}</p>
        </div>

        <div class="cs-block">
          <h5 class="cs-block-label">
            <i class="fas fa-drafting-compass" aria-hidden="true"></i> Approach
          </h5>
          <p>{{ cs.approach }}</p>
        </div>

        <div class="cs-block">
          <h5 class="cs-block-label">
            <i class="fas fa-chart-line" aria-hidden="true"></i> Outcome
          </h5>
          <p>{{ cs.outcome }}</p>
        </div>

        <div class="cs-footer">
          <div class="cs-tools">
            <span class="tool-badge" *ngFor="let tool of cs.tools">{{ tool }}</span>
          </div>
          <a *ngIf="cs.link" [href]="cs.link" target="_blank" rel="noopener noreferrer" class="cs-link">
            View Live Dashboard <i class="fas fa-arrow-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
